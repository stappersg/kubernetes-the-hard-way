reuse: &common_config
  image: images:ubuntu/24.04
  vm: true
  wait: true # wait for instance to be ready (incus agent running)
  shared_folder: false # disable shared folder (/incant) setup (default: enabled)
  provision:
    - ssh: true
    - copy: # copy a file using 'incus file push'
        source: ../vagrant/ubuntu/setup-kernel.sh
        target: /usr/local/sbin/
        mode: "0755"
        uid: 0
        gid: 0
    - | # an inlined script
      #!/bin/bash
      set -xe
      /usr/local/sbin/setup-kernel.sh

instances:
  controleplane01:
    type: c2-m2
    devices:
      eth0:
        ipv4.address: 192.168.56.11
    <<: *common_config
  controleplane02:
    type: c1-m1
    devices:
      eth0:
        ipv4.address: 192.168.56.12
    <<: *common_config
  loadbalancer:
    type: c1-m1
    devices:
      eth0:
        ipv4.address: 192.168.56.30
    <<: *common_config
  node01:
    type: c4-m4
    devices:
      eth0:
        ipv4.address: 192.168.56.21
    <<: *common_config
  node02:
    type: c4-m4
    devices:
      eth0:
        ipv4.address: 192.168.56.22
    <<: *common_config
